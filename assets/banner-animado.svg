<svg width="1400" height="350" viewBox="0 0 1400 350" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="1400" height="350" fill="#0d0d0d"/>

  <g transform="translate(120,10) scale(1.25)">
    <!-- Cuerpo del dragón: flota suavemente -->
    <g fill="#ffffff" opacity="0.95">
      <animateTransform attributeName="transform" type="translate" values="0,0; 0,-14; 0,0" dur="2.4s" repeatCount="indefinite"/>

      <polygon points="805,110 850,60 985,105"/>
      <polygon points="805,110 985,105 1010,155"/>
      <polygon points="805,110 1010,155 945,185"/>
      <polygon points="745,140 805,110 945,185"/>
      <polygon points="745,140 945,185 860,205"/>

      <!-- Ala superior: aletea -->
      <g>
        <animateTransform attributeName="transform" type="rotate" values="0 900 55; -22 900 55; 0 900 55" dur="1.1s" repeatCount="indefinite"/>
        <polygon points="900,30 950,5 965,55"/>
        <polygon points="950,5 1010,25 965,55"/>
        <polygon points="965,55 1010,25 1030,85"/>
        <polygon points="850,60 900,30 965,55"/>
        <polygon points="850,60 965,55 985,105"/>
      </g>

      <!-- Cola: aletea con leve retraso -->
      <g>
        <animateTransform attributeName="transform" type="rotate" values="0 695 190; 16 695 190; 0 695 190" dur="1.3s" repeatCount="indefinite"/>
        <polygon points="695,160 745,140 860,205"/>
        <polygon points="695,160 860,205 760,215"/>
        <polygon points="645,170 695,160 760,215"/>
        <polygon points="645,170 760,215 670,235"/>
      </g>
    </g>
  </g>

  <text x="70" y="150" font-family="Arial, Helvetica, sans-serif" font-size="58" font-weight="bold" fill="#ffffff">Uziel López</text>
  <text x="70" y="192" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#dcdcdc">Front-End Developer | Web Designer</text>
</svg>
